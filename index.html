<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy birthday!</title>
<meta name="theme-color" content="#5DB7F2">
<meta property="og:title" content="A birthday present for you">
<meta property="og:description" content="Open it and spin for your birthday prize.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%81%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Mitr:wght@400;500;600&display=swap">
<style>
  :root {
    --midnight: #0B2A5B;
    --ink-soft: #22507F;
    --party: #1E6FD9;
    --party-hi: #4B9BF0;
    --title: #0F55C2;
    --sky-top: #5DB7F2;
    --sky-mid: #9AD5FA;
    --sky-low: #DDF2FF;
    --frost: #EAF4FF;
    --gold: #FFC94A;
    --gold-deep: #D9961A;
    --font: 'Fredoka', 'Mitr', ui-rounded, system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    min-height: 100svh;
    font-family: var(--font);
    color: var(--midnight);
    background-color: var(--sky-mid);
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  button { font-family: inherit; }
  button:focus-visible { outline: 3px solid var(--midnight); outline-offset: 5px; }

  /* ---------- sky ---------- */
  .sky {
    position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
    background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 48%, var(--sky-low) 100%);
  }
  .sun {
    position: absolute; top: -70px; right: -70px; width: 220px; height: 220px; border-radius: 50%;
    background: radial-gradient(circle, #FFF8D6 0 34%, rgba(255, 234, 150, .6) 36%, rgba(255, 234, 150, 0) 70%);
  }
  /* a cloud is a pill with two puffs on top; font-size sets its size */
  .cloud {
    position: absolute; left: 0; width: 7em; height: 2em; border-radius: 999px; background: #fff;
    opacity: .92; animation: drift linear infinite;
  }
  .cloud::before, .cloud::after { content: ""; position: absolute; border-radius: 50%; background: inherit; }
  .cloud::before { width: 3.2em; height: 3.2em; left: 1.1em; bottom: .7em; }
  .cloud::after { width: 2.2em; height: 2.2em; right: 1.2em; bottom: .6em; }
  .cloud.c1 { top: 9%; font-size: 22px; animation-duration: 95s; animation-delay: -20s; }
  .cloud.c2 { top: 31%; font-size: 14px; opacity: .75; animation-duration: 120s; animation-delay: -75s; }
  .cloud.c3 { top: 56%; font-size: 26px; animation-duration: 110s; animation-delay: -50s; }
  .cloud.c4 { top: 78%; font-size: 17px; opacity: .8; animation-duration: 90s; animation-delay: -8s; }
  .cloud.c5 { top: 19%; font-size: 12px; opacity: .65; animation-duration: 140s; animation-delay: -100s; }
  @keyframes drift { from { transform: translateX(-100%); } to { transform: translateX(100vw); } }

  /* ---------- decoration ---------- */
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; }
  .balloons { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .balloon { position: absolute; width: 46px; opacity: .85; animation: float 9s ease-in-out infinite; }
  .balloon.b1 { left: -14px; top: 28%; animation-delay: -2s; }
  .balloon.b2 { right: -14px; top: 78%; width: 40px; animation-delay: -5s; }
  .balloon.b3 { left: 5%; bottom: 5%; width: 34px; opacity: .7; animation-delay: -7s; }
  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50% { transform: translateY(-16px) rotate(3deg); }
  }
  .bunting { display: block; width: 100%; max-width: 560px; height: auto; margin: 0 auto; }
  .flash {
    position: fixed; width: 60px; height: 60px; margin: -30px 0 0 -30px; border-radius: 50%;
    background: radial-gradient(circle, #fff 0%, rgba(234, 244, 255, .9) 35%, rgba(124, 196, 255, 0) 70%);
    pointer-events: none; z-index: 19; animation: boom .5s ease-out forwards;
  }
  @keyframes boom { from { transform: scale(.2); opacity: 1; } to { transform: scale(8); opacity: 0; } }

  .demo {
    position: relative; z-index: 2; margin: 0; padding: 8px 16px; text-align: center;
    font-size: 13.5px; line-height: 1.4; color: var(--midnight); background: rgba(255, 255, 255, .55);
  }
  .demo button {
    margin-left: 6px; padding: 2px 10px; border: 1px solid rgba(11, 42, 91, .35); border-radius: 999px;
    background: none; color: var(--midnight); font-size: 13px; cursor: pointer;
  }

  /* ---------- layout ---------- */
  .wrap {
    position: relative; z-index: 1; max-width: 440px; margin: 0 auto;
    padding: 0 16px max(40px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; align-items: center; text-align: center;
  }
  h1 {
    margin: 4px 0 0; font-weight: 700; font-size: clamp(36px, 10.5vw, 56px); line-height: 1.02;
    letter-spacing: -.01em; color: var(--title); text-wrap: balance; overflow-wrap: anywhere;
    text-shadow: 0 3px 0 #fff, 0 7px 14px rgba(15, 85, 194, .25);
  }
  .sub { margin: 12px 0 0; min-height: 1.4em; font-size: 18px; font-weight: 500; color: var(--ink-soft); }
  /* the stage keeps the wheel's height, so nothing jumps when the present turns into it */
  .stage {
    position: relative; width: 100%; min-height: calc(min(340px, 100vw - 32px) + 92px);
    display: flex; align-items: center; justify-content: center; margin-top: 18px;
  }

  /* ---------- present ---------- */
  .gift {
    position: relative; width: 190px; height: 196px; padding: 0; border: 0; background: none;
    cursor: pointer; transform-origin: 50% 92%; animation: idle 3.6s ease-in-out infinite;
  }
  .gift:disabled { cursor: progress; animation: none; opacity: .7; }
  .gift > span { position: absolute; display: block; }
  .gift-glow {
    left: 50%; bottom: -8px; width: 190px; height: 30px; transform: translateX(-50%);
    background: radial-gradient(ellipse, rgba(15, 70, 150, .28), rgba(15, 70, 150, 0) 70%);
  }
  .gift-body {
    left: 16px; right: 16px; bottom: 6px; height: 112px; border-radius: 8px 8px 18px 18px;
    background:
      radial-gradient(circle, rgba(255, 255, 255, .22) 4.5px, transparent 5.5px) 6px 10px / 30px 30px,
      linear-gradient(180deg, var(--party-hi), var(--party));
    box-shadow: inset 0 -12px 0 rgba(6, 20, 70, .25);
    transition: transform .3s ease-out, opacity .3s ease-out;
  }
  .gift-lid {
    left: 6px; right: 6px; bottom: 112px; height: 42px; border-radius: 12px;
    background: linear-gradient(180deg, #7DB8FF, var(--party-hi));
    box-shadow: 0 6px 0 rgba(6, 20, 70, .35);
    transition: transform .4s cubic-bezier(.2, .8, .3, 1), opacity .4s ease-out;
  }
  .ribbon {
    position: absolute; left: 50%; top: 0; bottom: 0; width: 30px; transform: translateX(-50%);
    background: linear-gradient(90deg, #F2B630, #FFE08A 50%, #F2B630);
  }
  .bow { position: absolute; left: 50%; bottom: 100%; width: 0; height: 0; }
  .bow i { position: absolute; display: block; }
  .bow .loop { bottom: -8px; width: 50px; height: 36px; border: 10px solid var(--gold); border-radius: 50%; }
  .bow .loop.l { right: -2px; transform: rotate(-24deg); }
  .bow .loop.r { left: -2px; transform: rotate(24deg); }
  .bow .knot { left: -12px; bottom: -10px; width: 24px; height: 20px; border-radius: 7px; background: #F2B630; }
  .gift.shaking { animation: shake .65s cubic-bezier(.36, .07, .19, .97) both; }
  .gift.pop { animation: none; }
  .gift.pop .gift-lid { transform: translateY(-90px) rotate(-28deg); opacity: 0; }
  .gift.pop .gift-body { transform: scale(1.25); opacity: 0; }
  .gift.pop .gift-glow { opacity: 0; }
  @keyframes idle {
    0%, 100% { transform: translateY(0); }
    35% { transform: translateY(-8px); }
    70% { transform: translateY(0); }
    76% { transform: rotate(-6deg); }
    82% { transform: rotate(6deg); }
    88% { transform: rotate(-3deg); }
    94% { transform: rotate(0); }
  }
  @keyframes shake {
    10%, 90% { transform: translateX(-2px) rotate(-2deg); }
    20%, 80% { transform: translateX(4px) rotate(3deg); }
    30%, 50%, 70% { transform: translateX(-7px) rotate(-6deg) scale(1.04); }
    40%, 60% { transform: translateX(7px) rotate(6deg) scale(1.06); }
  }

  /* ---------- prize wheel ---------- */
  .wheel-box { width: 100%; max-width: 340px; margin-top: 14px; }
  .wheel-box.appear { animation: appear .6s cubic-bezier(.2, .9, .25, 1.25) both; }
  @keyframes appear { from { transform: scale(.35); opacity: 0; } to { transform: none; opacity: 1; } }
  .wheel-wrap { position: relative; }
  .wheel-wrap::before {
    content: ""; position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
    box-shadow: 0 18px 40px rgba(15, 60, 130, .35);
  }
  .wheel { position: relative; display: block; width: 100%; height: auto; }
  .seg-label { font-weight: 700; font-size: 27px; font-variant-numeric: tabular-nums; }
  .seg-label.word { font-size: 19px; }
  .seg-label .cur { font-size: 18px; font-weight: 600; opacity: .75; }
  .bulb { fill: #FFE3A0; opacity: .5; }
  .wheel-box.spinning .bulb { animation: blink .5s steps(1) infinite; }
  .wheel-box.spinning .bulb:nth-child(even) { animation-delay: .25s; }
  .wheel-box.won .bulb { opacity: 1; }
  @keyframes blink { 0% { opacity: 1; } 50% { opacity: .25; } }
  .pointer {
    position: absolute; z-index: 1; left: 50%; top: -14px; width: 44px; height: 56px; margin-left: -22px;
    transform-origin: 50% 27%; filter: drop-shadow(0 3px 2px rgba(11, 42, 91, .35));
  }
  .wheel-box.won .pointer { animation: nod .5s ease-out 2; }
  @keyframes nod { 50% { transform: translateY(-5px) scale(1.08); } }
  .cur { font-size: .66em; font-weight: 500; margin-right: 1px; opacity: .65; }
  .spin-btn {
    display: block; width: 100%; height: 58px; margin-top: 22px; border: 0; border-radius: 999px;
    font-size: 24px; font-weight: 700; color: var(--midnight); cursor: pointer;
    background: linear-gradient(180deg, #FFE08A, var(--gold));
    box-shadow: 0 5px 0 var(--gold-deep), 0 10px 20px rgba(15, 60, 130, .3);
    transition: transform .08s, box-shadow .08s;
  }
  .spin-btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 var(--gold-deep); }
  .spin-btn:disabled { cursor: default; color: rgba(11, 42, 91, .55); background: rgba(255, 255, 255, .55); box-shadow: inset 0 0 0 2px rgba(11, 42, 91, .12); }
  .spin-btn.busy:disabled { color: var(--midnight); background: linear-gradient(180deg, #FFE08A, var(--gold)); opacity: .8; box-shadow: 0 2px 0 var(--gold-deep); }

  /* ---------- messages ---------- */
  .result { margin-top: 20px; }
  .result.pop { animation: appear .5s cubic-bezier(.2, .9, .25, 1.3) both; }
  .result-head { margin: 0; font-size: 20px; font-weight: 600; }
  .result-amount {
    margin: 4px 0 0; font-weight: 700; font-size: clamp(52px, 16vw, 76px); line-height: 1;
    color: var(--title); text-shadow: 0 4px 0 var(--gold), 0 10px 22px rgba(15, 85, 194, .25); font-variant-numeric: tabular-nums;
  }
  .result-amount.word { font-size: clamp(38px, 11vw, 58px); line-height: 1.1; }
  .result-amount .cur { font-size: .58em; opacity: .9; margin-right: 3px; }
  .result-note { margin: 12px auto 0; max-width: 34ch; font-size: 16px; line-height: 1.45; color: var(--ink-soft); }
  .warning {
    display: flex; gap: 10px; align-items: flex-start; width: 100%; max-width: 360px; margin: 22px 0 0;
    padding: 12px 14px; border-radius: 16px; text-align: left; font-size: 15.5px; font-weight: 500; line-height: 1.4;
    color: #6E4300; background: rgba(255, 240, 190, .8); border: 1.5px solid rgba(217, 150, 26, .55);
  }
  .warning svg { flex: none; width: 20px; height: 20px; margin-top: 1px; }
  .error {
    display: flex; flex-direction: column; align-items: flex-start; gap: 10px; width: 100%; max-width: 360px;
    margin-top: 20px; padding: 12px 14px; border-radius: 16px; text-align: left; font-size: 15.5px; line-height: 1.4;
    color: #8A1C1C; background: rgba(255, 236, 236, .9); border: 1.5px solid rgba(220, 80, 80, .5);
  }
  .error p { margin: 0; }
  .error button {
    padding: 8px 18px; border: 0; border-radius: 999px; cursor: pointer;
    font-size: 15px; font-weight: 600; color: #fff; background: var(--party);
  }

  @media (prefers-reduced-motion: reduce) {
    .gift, .balloon { animation: none; }
    .cloud { animation-play-state: paused; }
    .wheel-box.appear, .result.pop { animation-duration: .01s; }
    .wheel-box.won .pointer { animation: none; }
  }
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>

<div class="sky" aria-hidden="true">
  <div class="sun"></div>
  <i class="cloud c1"></i><i class="cloud c2"></i><i class="cloud c3"></i><i class="cloud c4"></i><i class="cloud c5"></i>
</div>

<div class="balloons" aria-hidden="true">
  <svg class="balloon b1" viewBox="0 0 40 90"><path d="M20 56 C 18 66, 24 72, 20 90" stroke="rgba(11,42,91,.3)" stroke-width="1.2" fill="none"/><ellipse cx="20" cy="26" rx="18" ry="24" fill="#1E6FD9"/><path d="M16 50 L24 50 L20 56 Z" fill="#1E6FD9"/><ellipse cx="13" cy="17" rx="4" ry="7" fill="rgba(255,255,255,.35)"/></svg>
  <svg class="balloon b2" viewBox="0 0 40 90"><path d="M20 56 C 23 66, 16 72, 20 90" stroke="rgba(11,42,91,.3)" stroke-width="1.2" fill="none"/><ellipse cx="20" cy="26" rx="18" ry="24" fill="#FFC94A"/><path d="M16 50 L24 50 L20 56 Z" fill="#FFC94A"/><ellipse cx="13" cy="17" rx="4" ry="7" fill="rgba(255,255,255,.5)"/></svg>
  <svg class="balloon b3" viewBox="0 0 40 90"><path d="M20 56 C 18 66, 24 72, 20 90" stroke="rgba(11,42,91,.3)" stroke-width="1.2" fill="none"/><ellipse cx="20" cy="26" rx="18" ry="24" fill="#FFFFFF"/><path d="M16 50 L24 50 L20 56 Z" fill="#FFFFFF"/><ellipse cx="13" cy="17" rx="4" ry="7" fill="rgba(93,183,242,.35)"/></svg>
</div>

<p class="demo" id="demo" hidden>Preview mode: spins aren't saved. Add your Google Script link to go live.<button type="button" id="demoReset">Reset preview</button></p>

<main class="wrap">
  <svg class="bunting" id="bunting" viewBox="0 0 400 64" aria-hidden="true"></svg>

  <h1 id="title">Happy birthday!</h1>
  <p class="sub" id="sub"></p>

  <section class="stage">
    <button type="button" class="gift" id="gift" aria-label="Open your present" disabled>
      <span class="gift-glow"></span>
      <span class="gift-body"><span class="ribbon"></span></span>
      <span class="gift-lid"><span class="ribbon"></span><span class="bow"><i class="loop l"></i><i class="loop r"></i><i class="knot"></i></span></span>
    </button>

    <div class="wheel-box" id="machine" hidden>
      <div class="wheel-wrap">
        <svg class="pointer" id="pointer" viewBox="0 0 44 56" aria-hidden="true">
          <defs><linearGradient id="pointerGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE08A"/><stop offset="1" stop-color="#F2B630"/></linearGradient></defs>
          <path d="M22 53 L5.5 22 A18 18 0 1 1 38.5 22 Z" fill="url(#pointerGrad)" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
          <circle cx="22" cy="15" r="5" fill="#0B2A5B"/>
        </svg>
        <svg class="wheel" id="wheel" viewBox="0 0 340 340" aria-hidden="true">
          <defs>
            <linearGradient id="rimGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5AA2F5"/><stop offset="1" stop-color="#1553B0"/></linearGradient>
            <radialGradient id="hubGrad" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#FFE9A8"/><stop offset="1" stop-color="#F2B630"/></radialGradient>
          </defs>
          <circle cx="170" cy="170" r="169" fill="url(#rimGrad)"/>
          <g id="bulbs"></g>
          <circle cx="170" cy="170" r="151" fill="#0B2A5B"/>
          <g id="disc"></g>
          <circle cx="170" cy="170" r="30" fill="url(#hubGrad)" stroke="#fff" stroke-width="5"/>
          <path d="M170 157 L173.23 165.55 L182.36 165.98 L175.23 171.7 L177.64 180.52 L170 175.5 L162.36 180.52 L164.77 171.7 L157.64 165.98 L166.77 165.55 Z" fill="#fff"/>
        </svg>
      </div>
      <button type="button" class="spin-btn" id="spin" disabled>Spin</button>
    </div>
  </section>

  <div class="result" id="result" role="status" aria-live="polite" hidden>
    <p class="result-head" id="resultHead"></p>
    <p class="result-amount" id="resultAmount"></p>
    <p class="result-note" id="resultNote"></p>
  </div>

  <p class="warning" id="warning">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 2.5 20h19L12 3z"/><path d="M12 10v4.5"/><path d="M12 17.6v.1"/></svg>
    <span id="warningText"></span>
  </p>

  <div class="error" id="error" role="alert" hidden>
    <p id="errorText"></p>
    <button type="button" id="retry">Try again</button>
  </div>
</main>

<script>
/* ============================ SETUP ============================ */
// Paste your Google Apps Script Web app URL here (it ends with /exec).
// Leave it as it is to try the page in preview mode.
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxO7CAGB3yyPyj9Qrx1NRPsWdqo3eaWN00DcJUfRlMhHwVwYcqAXgJh2dF5tydfY4Zo/exec';

// Words on the page. Change them to any language you like.
const TEXT = {
  title: name => name ? `Happy birthday, ${name}!` : 'Happy birthday!',
  loading: 'Getting your present ready…',
  tapGift: 'Tap the present to open it',
  readyToSpin: 'Spin for your birthday prize',
  spin: 'Spin',
  spinning: 'Spinning…',
  used: 'Spin used',
  warning: 'You only get one spin. Your result is saved, even if you refresh.',
  wonHead: 'You won',
  zeroHead: 'No luck this time',
  alreadyWonHead: 'You already spun and won',
  alreadyZeroHead: 'You already spun and got',
  doneSub: 'Here’s your birthday prize',
  savedNote: 'That was your one spin.',
  alreadySub: 'You’ve already used your spin',
  alreadyNote: '',
  invalidSub: 'This link doesn’t work',
  invalidNote: 'Ask the person who sent it to you for a new link.',
  offline: 'Can’t connect right now. Check your internet, then try again.',
  spinFailed: 'Your spin didn’t go through. Check your internet, then spin again.',
  retry: 'Try again',
};
/* =============================================================== */

(() => {
  'use strict';

  const DEMO = !/^https?:\/\//i.test(SCRIPT_URL.trim());
  const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const CODE = (new URLSearchParams(location.search).get('code') || '').trim();
  const SPEED = REDUCED ? 360 : 760, ACCEL = 900; // wheel speed in degrees per second

  const $ = id => document.getElementById(id);
  const el = {
    title: $('title'), sub: $('sub'), gift: $('gift'), machine: $('machine'), wheel: $('wheel'),
    spin: $('spin'), result: $('result'), resultHead: $('resultHead'), resultAmount: $('resultAmount'),
    resultNote: $('resultNote'), warning: $('warning'), error: $('error'), errorText: $('errorText'), retry: $('retry'),
  };
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  // A prize is an amount (150) or a word ('1 art toy'). Amounts that arrive as text become numbers again.
  const norm = v => typeof v === 'number' ? v : /^\s*-?\d+(\.\d+)?\s*$/.test(v) ? Number(v) : String(v ?? '').trim();
  const info = { name: '', prizes: [150, 250, 350, '1 art toy', 777], currency: '฿' };
  let phase = 'loading';
  let wheel = null;
  let retryAction = null;

  /* ---------------- talking to the Google Script ---------------- */
  const api = DEMO ? previewApi() : scriptApi();

  function scriptApi() {
    const base = SCRIPT_URL.trim();
    async function call(url, opts = {}) {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 25000);
      try {
        const res = await fetch(url, { ...opts, signal: ctrl.signal });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return await res.json();
      } catch (err) {
        console.error('[birthday-spin] Could not reach the Google Script. Check SCRIPT_URL, and that the Web app is deployed with "Who has access: Anyone".', err);
        throw err;
      } finally {
        clearTimeout(timer);
      }
    }
    return {
      status: () => call(`${base}?action=status&code=${encodeURIComponent(CODE)}&t=${Date.now()}`),
      // text/plain body keeps this a "simple" request, which Apps Script accepts from any site
      spin: () => call(base, { method: 'POST', body: JSON.stringify({ action: 'spin', code: CODE }) }),
    };
  }

  function previewApi() {
    const KEY = 'birthday-spin-preview';
    let mem = null;
    const load = () => { try { const v = localStorage.getItem(KEY); return v ? JSON.parse(v) : mem; } catch { return mem; } };
    const save = v => { mem = v; try { v ? localStorage.setItem(KEY, JSON.stringify(v)) : localStorage.removeItem(KEY); } catch {} };
    const meta = () => ({ name: '', prizes: [150, 250, 350, '1 art toy', 777], currency: '฿' });
    return {
      async status() {
        await sleep(450);
        const s = load();
        return s ? { ...meta(), state: 'spun', already: true, ...s } : { ...meta(), state: 'ready' };
      },
      async spin() {
        await sleep(700);
        const s = load();
        if (s) return { ...meta(), state: 'spun', already: true, ...s };
        const prizes = meta().prizes;
        const prize = prizes[(Math.random() * prizes.length) | 0]; // every prize has the same chance
        const rec = { prize, time: new Date().toISOString() };
        save(rec);
        return { ...meta(), state: 'spun', already: false, ...rec };
      },
      reset() { save(null); },
    };
  }

  /* ---------------- particles ---------------- */
  const fx = (() => {
    const canvas = $('fx');
    const ctx = canvas.getContext('2d');
    const COLORS = ['#1E6FD9', '#0B4FB3', '#FFFFFF', '#4B9BF0', '#FFC94A', '#F2B630'];
    const COOL = ['#1E6FD9', '#0B4FB3', '#FFFFFF', '#4B9BF0'];
    let W = 0, H = 0, parts = [], raf = 0, last = 0;
    const rand = (a, b) => a + Math.random() * (b - a);
    const pick = a => a[(Math.random() * a.length) | 0];

    function size() {
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      W = innerWidth; H = innerHeight;
      canvas.width = W * dpr; canvas.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    size();
    addEventListener('resize', size);

    function make(x, y, vx, vy, opts) {
      const r = Math.random();
      const k = opts.coins === false ? (r < .65 ? 'rect' : r < .82 ? 'dot' : 'star')
        : (r < .52 ? 'rect' : r < .68 ? 'dot' : r < .84 ? 'star' : 'coin');
      return {
        x, y, vx, vy, k,
        c: k === 'coin' ? '#FFC94A' : pick(opts.coins === false ? COOL : COLORS),
        s: k === 'coin' ? rand(6, 9) : k === 'star' ? rand(5, 9) : rand(2.5, 4.5),
        w: rand(6, 10), h: rand(9, 15), rot: rand(0, 6.28), vr: rand(-9, 9),
        flip: rand(0, 6.28), vf: rand(6, 14), life: 0, max: opts.life ? rand(...opts.life) : rand(1.6, 2.8),
      };
    }
    function add(p) { if (parts.length < 700) parts.push(p); }
    function burst(x, y, opts = {}) {
      const { count = 120, speed = [350, 950], up = 220 } = opts;
      for (let i = 0; i < count; i++) {
        const a = rand(0, Math.PI * 2), sp = rand(speed[0] * .3, speed[1]) * (.6 + .4 * Math.random());
        add(make(x, y, Math.cos(a) * sp, Math.sin(a) * sp - up, opts));
      }
      run();
    }
    function rain(count = 120) {
      for (let i = 0; i < count; i++) add(make(rand(0, W), rand(-H * .5, -10), rand(-60, 60), rand(60, 240), { life: [3.5, 5.5] }));
      run();
    }
    function run() { if (!raf) { last = performance.now(); raf = requestAnimationFrame(step); } }
    function step(now) {
      const dt = Math.min(.04, (now - last) / 1000); last = now;
      ctx.clearRect(0, 0, W, H);
      parts = parts.filter(p => p.life < p.max && p.y < H + 40);
      for (const p of parts) {
        const drag = p.k === 'rect' || p.k === 'star' ? 2.4 : 1.3;
        p.vx -= p.vx * drag * dt;
        p.vy += (980 - p.vy * drag) * dt;
        p.x += p.vx * dt; p.y += p.vy * dt;
        p.rot += p.vr * dt; p.flip += p.vf * dt; p.life += dt;
        ctx.globalAlpha = Math.max(0, Math.min(1, (p.max - p.life) / .5));
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.c;
        if (p.k === 'rect') {
          ctx.scale(1, Math.cos(p.flip));
          ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        } else if (p.k === 'dot') {
          ctx.beginPath(); ctx.arc(0, 0, p.s, 0, 6.283); ctx.fill();
        } else if (p.k === 'star') {
          const s = p.s, t = s * .28;
          ctx.beginPath();
          ctx.moveTo(0, -s); ctx.lineTo(t, -t); ctx.lineTo(s, 0); ctx.lineTo(t, t);
          ctx.lineTo(0, s); ctx.lineTo(-t, t); ctx.lineTo(-s, 0); ctx.lineTo(-t, -t);
          ctx.closePath(); ctx.fill();
        } else {
          ctx.scale(Math.cos(p.flip), 1);
          ctx.beginPath(); ctx.arc(0, 0, p.s, 0, 6.283); ctx.fill();
          ctx.strokeStyle = '#D9961A'; ctx.lineWidth = 1.6;
          ctx.beginPath(); ctx.arc(0, 0, p.s * .62, 0, 6.283); ctx.stroke();
        }
        ctx.restore();
      }
      ctx.globalAlpha = 1;
      raf = parts.length ? requestAnimationFrame(step) : 0;
      if (!raf) ctx.clearRect(0, 0, W, H);
    }
    return { burst, rain };
  })();

  function flashAt(x, y) {
    const f = document.createElement('div');
    f.className = 'flash';
    f.style.left = x + 'px';
    f.style.top = y + 'px';
    document.body.appendChild(f);
    f.addEventListener('animationend', () => f.remove());
  }

  /* ---------------- wheel ---------------- */
  const SVG_NS = 'http://www.w3.org/2000/svg';
  const C = 170; // centre of the wheel drawing

  function svgEl(tag, attrs) {
    const n = document.createElementNS(SVG_NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    return n;
  }
  // a point on the wheel, `deg` degrees clockwise from the top
  function polar(r, deg) {
    const a = deg * Math.PI / 180;
    return [C + r * Math.sin(a), C - r * Math.cos(a)];
  }
  function prizeNode(v) {
    if (typeof v !== 'number') return document.createTextNode(v);
    const frag = document.createDocumentFragment();
    const c = document.createElement('span');
    c.className = 'cur';
    c.textContent = info.currency;
    frag.append(c, document.createTextNode(v.toLocaleString()));
    return frag;
  }

  class Wheel {
    constructor(values) {
      this.values = values.slice();
      this.n = this.values.length;
      this.seg = 360 / this.n; // every slice is the same size: every prize has the same chance
      this.disc = $('disc');
      this.pointer = $('pointer');
      this.mode = 'idle'; this.v = 0; this.rot = 0; this.edge = 0;
      this.draw();
    }
    draw() {
      const { n, seg } = this;
      for (let i = 0; i < n; i++) {
        const v = this.values[i];
        // blue and white take turns, a word prize (the art toy) is gold,
        // and an odd count gets a light-blue last slice so it doesn't match the first
        const fill = typeof v !== 'number' ? '#FFC94A' : i === n - 1 && n % 2 ? '#7CC4FF' : i % 2 ? '#FFFFFF' : '#1E6FD9';
        const [x0, y0] = polar(148, i * seg), [x1, y1] = polar(148, (i + 1) * seg);
        this.disc.append(svgEl('path', {
          d: `M${C} ${C} L${x0} ${y0} A148 148 0 ${seg > 180 ? 1 : 0} 1 ${x1} ${y1} Z`,
          fill, stroke: 'rgba(11,42,91,.18)', 'stroke-width': 1.5,
        }));
        const label = svgEl('text', {
          x: C, y: C - 100, dy: '.35em', 'text-anchor': 'middle', fill: fill === '#1E6FD9' ? '#FFFFFF' : '#0B2A5B',
          class: 'seg-label' + (typeof v === 'number' ? '' : ' word'),
          transform: `rotate(${(i + .5) * seg} ${C} ${C})`,
        });
        if (typeof v === 'number') {
          const cur = svgEl('tspan', { class: 'cur' });
          cur.textContent = info.currency;
          label.append(cur, v.toLocaleString());
        } else {
          label.textContent = v;
        }
        this.disc.append(label);
      }
      const bulbs = $('bulbs');
      for (let i = 0; i < 20; i++) {
        const [x, y] = polar(160, i * 18 + 9);
        bulbs.append(svgEl('circle', { class: 'bulb', cx: x, cy: y, r: 4.2 }));
      }
    }
    angleFor(i) { return -(i + .5) * this.seg; } // rotation that puts the middle of slice i under the pointer
    set(r) {
      this.rot = r;
      this.disc.setAttribute('transform', `rotate(${(r % 360).toFixed(2)} ${C} ${C})`);
      const edge = Math.floor(r / this.seg);
      if (edge !== this.edge) { // a slice edge just passed the pointer: flick it
        this.edge = edge;
        if (!REDUCED && this.mode !== 'idle' && this.pointer.animate) {
          this.pointer.animate([{ transform: 'rotate(0)' }, { transform: 'rotate(-18deg)' }, { transform: 'rotate(0)' }], { duration: 150, easing: 'ease-out' });
        }
      }
    }
    rest(value) {
      const idx = Math.max(0, this.values.indexOf(norm(value)));
      this.mode = 'idle'; this.v = 0;
      this.set(((this.angleFor(idx) % 360) + 360) % 360);
    }
    start() { this.mode = 'run'; this.v = 0; }
    stopOn(value) {
      return new Promise(resolve => {
        const idx = Math.max(0, this.values.indexOf(norm(value)));
        const v = Math.max(this.v, 300);
        // land somewhere inside the slice, never right on an edge
        const want = this.angleFor(idx) + (Math.random() - .5) * this.seg * .6;
        let target = this.rot + v * (REDUCED ? 1.2 : 4) / 3; // slowing from the current speed takes about 4s
        target += (((want - target) % 360) + 360) % 360;
        this.from = this.rot;
        this.dist = target - this.rot;
        this.dur = (3 * this.dist / v) * 1000; // ease-out that starts at the current speed
        this.s0 = performance.now();
        this.mode = 'stop';
        this.done = resolve;
        loop();
      });
    }
    update(now, dt) {
      if (this.mode === 'idle') return false;
      if (this.mode === 'run') {
        this.v = Math.min(SPEED, this.v + ACCEL * dt);
        this.set(this.rot + this.v * dt);
        return true;
      }
      const t = Math.min(1, (now - this.s0) / this.dur);
      this.set(this.from + this.dist * (1 - Math.pow(1 - t, 3)));
      if (t < 1) return true;
      this.mode = 'idle'; this.v = 0;
      this.done();
      return false;
    }
  }

  let raf = 0, lastT = 0;
  function loop() {
    if (raf) return;
    lastT = performance.now();
    raf = requestAnimationFrame(tick);
  }
  function tick(now) {
    const dt = Math.min(.05, (now - lastT) / 1000);
    lastT = now;
    raf = wheel && wheel.update(now, dt) ? requestAnimationFrame(tick) : 0;
  }

  function buildWheel() {
    if (wheel) return;
    wheel = new Wheel(info.prizes);
    wheel.set(Math.random() * 360);
  }

  /* ---------------- screens ---------------- */
  function applyInfo(s) {
    if (Array.isArray(s.prizes) && s.prizes.length) info.prizes = s.prizes.map(norm);
    if (typeof s.currency === 'string') info.currency = s.currency;
    info.name = s.name || '';
    el.title.textContent = TEXT.title(info.name);
    document.title = TEXT.title(info.name);
  }

  function showError(message, retry) {
    el.errorText.textContent = message;
    retryAction = retry || null;
    el.retry.hidden = !retry;
    el.error.hidden = false;
  }
  function hideError() { el.error.hidden = true; }

  function showMachine(animate) {
    buildWheel();
    el.gift.hidden = true;
    el.machine.hidden = false;
    if (animate) el.machine.classList.add('appear');
  }

  function showResult(res, kind) {
    const prize = norm(res.prize);
    const zero = typeof prize === 'number' && prize <= 0;
    el.resultHead.textContent = kind === 'new'
      ? (zero ? TEXT.zeroHead : TEXT.wonHead)
      : (zero ? TEXT.alreadyZeroHead : TEXT.alreadyWonHead);
    el.resultAmount.classList.toggle('word', typeof prize !== 'number');
    el.resultAmount.replaceChildren(prizeNode(prize));
    el.resultNote.textContent = kind === 'new' ? TEXT.savedNote : TEXT.alreadyNote;
    el.resultNote.hidden = !el.resultNote.textContent;
    el.result.hidden = false;
    el.result.classList.remove('pop');
    void el.result.offsetWidth;
    el.result.classList.add('pop');
  }

  function finish(res, kind) {
    phase = 'done';
    el.machine.classList.remove('spinning');
    el.machine.classList.add('won');
    el.spin.classList.remove('busy');
    el.spin.disabled = true;
    el.spin.textContent = TEXT.used;
    el.warning.hidden = true;
    el.sub.textContent = kind === 'new' ? TEXT.doneSub : TEXT.alreadySub;
    showResult(res, kind);
    if (kind === 'new') celebrate(norm(res.prize));
  }

  function showSpun(s) {
    showMachine(false);
    wheel.rest(s.prize);
    finish(s, 'already');
  }

  function showInvalid() {
    phase = 'invalid';
    el.gift.hidden = true;
    el.machine.hidden = true;
    el.warning.hidden = true;
    el.sub.textContent = TEXT.invalidSub;
    showError(TEXT.invalidNote);
  }

  function celebrate(prize) {
    const r = el.wheel.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    const amounts = info.prizes.filter(p => typeof p === 'number').sort((a, b) => a - b);
    // a word prize (the art toy) gets the biggest party
    const rank = typeof prize !== 'number' ? 1 : Math.max(0, amounts.indexOf(prize)) / Math.max(1, amounts.length - 1);
    if (typeof prize === 'number' && prize <= 0) {
      fx.burst(cx, cy, { count: 28, speed: [160, 420], up: 120, coins: false });
      return;
    }
    fx.burst(cx, cy, { count: REDUCED ? 40 : Math.round(80 + rank * 120), speed: [300, 900 + rank * 300] });
    if (!REDUCED && rank >= .6) fx.rain(rank >= 1 ? 220 : 110);
  }

  /* ---------------- actions ---------------- */
  async function openGift() {
    if (phase !== 'gift') return;
    phase = 'opening';
    hideError();
    const g = el.gift;
    if (!REDUCED) {
      g.classList.add('shaking');
      await sleep(650);
    }
    const b = g.querySelector('.gift-body').getBoundingClientRect();
    const cx = b.left + b.width / 2, cy = b.top + b.height / 2;
    g.classList.remove('shaking');
    g.classList.add('pop');
    flashAt(cx, cy);
    fx.burst(cx, cy, { count: REDUCED ? 40 : 170, speed: [400, 1050], up: 260 });
    await sleep(REDUCED ? 80 : 300);
    showMachine(true);
    el.sub.textContent = TEXT.readyToSpin;
    el.spin.disabled = false;
    phase = 'wheel';
    el.spin.focus({ preventScroll: true });
  }

  async function stopNeutral() {
    await wheel.stopOn(info.prizes[(Math.random() * info.prizes.length) | 0]);
  }

  async function spinFailed(message) {
    await stopNeutral();
    el.machine.classList.remove('spinning');
    el.spin.classList.remove('busy');
    el.spin.textContent = TEXT.spin;
    el.spin.disabled = false;
    phase = 'wheel';
    showError(message);
  }

  async function doSpin() {
    if (phase !== 'wheel') return;
    phase = 'spinning';
    hideError();
    el.spin.disabled = true;
    el.spin.classList.add('busy');
    el.spin.textContent = TEXT.spinning;
    el.machine.classList.add('spinning');
    wheel.start();
    loop();

    const minSpin = sleep(REDUCED ? 500 : 1400);
    let res;
    try {
      res = await api.spin();
    } catch (err) {
      await minSpin;
      return spinFailed(TEXT.spinFailed);
    }
    await minSpin;
    if (res.state === 'invalid') { await stopNeutral(); return showInvalid(); }
    if (res.state !== 'spun') {
      console.error('[birthday-spin] Script error:', res.message);
      return spinFailed(TEXT.spinFailed);
    }

    // Slow the wheel down onto the prize the server picked
    await wheel.stopOn(res.prize);
    finish(res, res.already ? 'already' : 'new');
  }

  async function boot() {
    phase = 'loading';
    hideError();
    el.sub.textContent = TEXT.loading;
    el.gift.disabled = true;
    let s;
    try {
      s = await api.status();
    } catch (err) {
      el.sub.textContent = '';
      return showError(TEXT.offline, boot);
    }
    applyInfo(s);
    if (s.state === 'invalid') return showInvalid();
    if (s.state === 'spun') return showSpun(s);
    if (s.state === 'ready') {
      phase = 'gift';
      el.gift.disabled = false;
      el.sub.textContent = TEXT.tapGift;
      return;
    }
    console.error('[birthday-spin] Script error:', s.message);
    el.sub.textContent = '';
    showError(TEXT.offline, boot);
  }

  function buildBunting() {
    const svg = $('bunting');
    const NS = 'http://www.w3.org/2000/svg';
    const colors = ['#1E6FD9', '#FFFFFF', '#FFC94A', '#4B9BF0'];
    const y = x => 6 + 20 * (1 - Math.pow((x - 200) / 200, 2));
    const line = document.createElementNS(NS, 'path');
    line.setAttribute('d', 'M0 6 Q200 46 400 6');
    line.setAttribute('fill', 'none');
    line.setAttribute('stroke', 'rgba(11,42,91,.35)');
    line.setAttribute('stroke-width', '1.5');
    svg.append(line);
    for (let i = 0; i < 13; i++) {
      const x = 22 + i * 29.7;
      const flag = document.createElementNS(NS, 'path');
      flag.setAttribute('d', `M${x - 11} ${y(x - 11)} L${x + 11} ${y(x + 11)} L${x} ${y(x) + 26} Z`);
      flag.setAttribute('fill', colors[i % colors.length]);
      svg.append(flag);
    }
  }

  /* ---------------- start ---------------- */
  $('warningText').textContent = TEXT.warning;
  el.spin.textContent = TEXT.spin;
  el.retry.textContent = TEXT.retry;
  el.gift.addEventListener('click', openGift);
  el.spin.addEventListener('click', doSpin);
  el.retry.addEventListener('click', () => { const a = retryAction; hideError(); if (a) a(); });
  if (DEMO) {
    $('demo').hidden = false;
    $('demoReset').addEventListener('click', () => { api.reset(); location.reload(); });
  }
  buildBunting();
  boot();
})();
</script>
</body>
</html>
